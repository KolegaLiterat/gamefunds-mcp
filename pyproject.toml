[project]
name = "gamefunds-mcp"
version = "0.1.0"
description = "MCP server for the GameFunds funding directory + outreach pipeline"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastmcp==3.4.4",
  "httpx>=0.27",
]

[project.scripts]
gamefunds = "gamefunds.cli:main"

[project.optional-dependencies]
http = [
  "uvicorn>=0.30",
  "slowapi>=0.1.9",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

