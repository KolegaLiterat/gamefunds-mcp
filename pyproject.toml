[project]
name = "gamefunds-mcp"
version = "0.1.0"
description = "MCP server for the GameFunds funding directory + outreach pipeline"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastmcp==2.14.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

